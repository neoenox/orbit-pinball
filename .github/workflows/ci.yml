name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Playwright config runs against the msedge channel, the same
      # browser used locally; install it plus its system dependencies.
      - name: Install Microsoft Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Unit tests
        run: npm test

      # Fails on any type error (src and tests) or bundling problem.
      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Browser tests
        run: npm run test:browser

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
